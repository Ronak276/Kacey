<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0086ff" />
      <stop offset="100%" stop-color="#005fb2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0070d2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle badge -->
  <rect width="100" height="100" rx="24" fill="#f0f7ff" stroke="#bae6fd" stroke-width="2"/>

  <!-- Main Kacey Paw Logo Icon -->
  <g filter="url(#glow)" fill="url(#pawGrad)">
    <!-- Central Pad -->
    <path d="M50,42 C38,42 28,52 28,66 C28,78 38,88 50,88 C62,88 72,78 72,66 C72,52 62,42 50,42 Z" />
    <!-- 4 Toe Pads -->
    <circle cx="27" cy="33" r="10" />
    <circle cx="43" cy="20" r="10" />
    <circle cx="57" cy="20" r="10" />
    <circle cx="73" cy="33" r="10" />
  </g>
</svg>
